name: Backend CI

on:
  pull_request:
    branches:
      - main

jobs:
  backend-checks:
    name: Backend Quality Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      database:
        image: postgres:16
        env:
          POSTGRES_DB: tripmate_test
          POSTGRES_USER: tripmate_user
          POSTGRES_PASSWORD: tripmate1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripmate_user -d tripmate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://tripmate_user:tripmate1234@localhost:5432/tripmate_test
      TEST_DATABASE_URL: postgresql+psycopg2://tripmate_user:tripmate1234@localhost:5432/tripmate_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff lint check
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run tests
        run: pytest || [ $? -eq 5 ]